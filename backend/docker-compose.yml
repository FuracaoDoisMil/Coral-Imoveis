services:

  backend:
    build: .
    ports:
      - "5000:5000"
    depends_on:
      - mysql

  mysql:
    image: mysql:8
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: imobiliaria

    ports:
      - "3307:3306"

    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql